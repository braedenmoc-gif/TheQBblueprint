dational Footwork",focus:"Establish your base",objective:"Build the foundational movement patterns every quarterback rep starts from \u2014 grip, carriage, hips-lead throwing, and base footwork.",activities:["Baseline test: accuracy, drop timing, and a mechanics video","Grip, carriage, and hips-lead throwing","Three-step and five-step footwork","Mechanics checkpoint and platform throws at three levels"],deliverable:"Week 1 scorecard + mechanics checkpoint"},{week:2,title:"Pocket Movement & Throwing Accuracy",focus:"Layer movement onto your base",objective:"Add pocket movement and translate it into accurate throwing at all three levels of the field.",activities:["Climb, slide, reset, and escape movements","Accuracy ladders at short, intermediate, and deep","Slide and reset under a rushing defender","Off-platform throws and an accuracy test on moving targets"],deliverable:"Week 2 scorecard + accuracy test"},{week:3,title:"Reading Defenses & Decision-Making",focus:"Sharpen your eyes",objective:"Develop pre-snap recognition, coverage shell identification, and progression discipline \u2014 the work that turns a thrower into a decision-maker.",activities:["Pre-snap identification and one-high vs. two-high reads","Situational decisions and timing windows","Pressure recognition and hot reads","A decision test and film or QB Lab work"],deliverable:"Week 3 scorecard + decision test"},{week:4,title:"Game-Speed Integration & Evaluation",focus:"Put it together at game speed",objective:"Integrate everything from the first three weeks at game speed, with a final assessment that grades growth across all four pillars.",activities:["Tempo circuit and pocket integration","Pressure throws and the two-minute drill","Red zone and third-down package","A deload day, then the final assessment against your day-1 numbers"],deliverable:"Final assessment + offseason continuation plan"}],rt=[{slug:"4-week-quarterback-development-playbook",id:"sku_playbook_001",name:"4-Week Quarterback Development Playbook",tagline:"A complete, progressive training program",price:24,cover:{hue:"from-electric via-electricdark to-[#0c1430]",label:"PLAYBOOK"},accent:"#3B82F6",shortDescription:"A 28-day throwing program with a full drill library: 47 drills with coaching cues and common mistakes, 28 day-by-day session cards with set and rep counts, a throw-volume plan, solo and partner options, four weekly scorecards, and a final assessment.",longDescription:"The Playbook is a 28-day quarterback development program for high school and college QBs, built around a 47-drill library. Every drill has a purpose, setup, step-by-step execution, coaching cues, common mistakes, and a progression. Every day is a session card with exact drills, sets, reps, and throw counts, and the weekly throw volume is calculated so you can manage your arm. You establish mechanics first, add pocket movement and accuracy, then move to reading defenses and game-speed execution. Four scorecards and a final assessment measure real change. It also includes a baseline test, a mechanics checklist, a fault-and-fix table, recovery guidance, and a plan for what to do after day 28. It is a program you run, not a book you skim.",who:"High school and college quarterbacks who want a structured, progressive training plan they can execute every day of the offseason.",benefits:["47-drill library with cues, common mistakes, and progressions","28 day-by-day session cards with sets, reps, and throw counts","Calculated weekly throw volume and a safe ramp-up plan","Baseline test, mechanics checklist, and a fault-and-fix table","Solo, partner, and net options for every session","Four weekly scorecards and a final four-pillar assessment","Recovery guidance and a continuation plan for after day 28"],sections:[{title:"Week 1 \u2014 Mechanics & Foundational Footwork",body:"Establish your base. You test where you are on day 1, then build grip, carriage, hips-lead throwing, and the three-step and five-step drops that every rep starts from.",bullets:["Day 1 baseline test (accuracy, drop timing, video)","Grip, carriage, and hips-lead throwing","Three-step and five-step footwork","Mechanics checkpoint and platform throws at three levels","Week 1 scorecard"]},{title:"Week 2 \u2014 Pocket Movement & Throwing Accuracy",body:"Layer movement onto your base. You learn climb, slide, reset, and escape, then raise accuracy with ladders, a rush simulation, and off-platform throws.",bullets:["Four pocket movements: climb, slide, reset, escape","Accuracy ladders at three depths","Slide and reset under a rushing defender","Off-platform throwing and an accuracy test on moving targets","Week 2 scorecard"]},{title:"Week 3 \u2014 Reading Defenses & Decision-Making",body:"Sharpen your eyes. Pre-snap identification, one-high and two-high reads, pressure recognition, and timing windows, paired with the Film Room Guide.",bullets:["Pre-snap identification reps","One-high vs. two-high reads","Situational decisions and timing windows","Pressure recognition and hot reads","Decision test and Week 3 scorecard"]},{title:"Week 4 \u2014 Game-Speed Integration & Evaluation",body:"Put it together. Tempo circuits, throws under pressure, the two-minute drill, a deload day, and a day-26 final assessment compared with your day-1 numbers.",bullets:["Tempo circuit and pocket integration","Pressure throws and the two-minute drill","Red zone and third-down package","Sharpen and deload day","Final assessment (day 26) and continuation plan (day 28)"]}],preview:["Day card layout with drills, sets, reps, and throw counts","Drill entry: purpose, setup, cues, mistakes, progression","Mechanics checklist and fault-and-fix table","Weekly scorecard and final assessment"],faqs:[{q:"Do I need a coach to run this?",a:"No. The program is designed for self-directed athletes. Every day has clear objectives, drills, and checkpoints so you can execute it on your own or with a teammate."},{q:"How much time per day?",a:"Sessions run roughly 45 to 75 minutes. The book includes weekly throw totals and guidance for adjusting the load if you are in season or coming off a heavy throwing stretch."},{q:"What format is the playbook?",a:"A 59-page downloadable PDF you can print or use on any device. You need a football and a field. A partner or a net is helpful, and the book gives solo options for every day."}],format:"Downloadable PDF",pages:"59 pages",badge:"Featured Program"},{slug:"qb-film-room-guide",id:"sku_filmroom_002",name:"QB Film Room Guide",tagline:"Develop your football IQ one frame at a time",price:19,cover:{hue:"from-[#1c2230] via-[#10131a] to-[#0c0f15]",label:"FILM ROOM"},accent:"#A9ADB4",shortDescription:"A 43-page guide to reading defenses: 20 coverage looks with diagrams, pre-snap and post-snap keys, pressure indicators, route concepts against each coverage, progression rules, and film-grading worksheets you reuse every week.",longDescription:"The Film Room Guide teaches you how to watch film as a quarterback. It covers eight coverages with diagrams, the pre-snap and post-snap keys for each, how to spot pressure, six route concepts and where the ball goes against each coverage, and a repeatable film-study routine with three printable worksheets. Twenty practice looks with answers let you test yourself, and a one-page cheat sheet goes in your bag. It is honest about the limits of pre-snap reads: not every coverage can be identified before the snap, so it teaches you to confirm after it. Use it alone or with the free QB Lab and the Playbook.",who:"Quarterbacks who want to improve pre-snap recognition, learn coverage concepts, and build a repeatable film-study routine.",benefits:["Eight coverages broken down one per page: Cover 0, 1, 2, Tampa 2, 3, 4, 6, and 2-Man","Pre-snap looks, post-snap keys, strengths, weaknesses, and concepts that beat each one","A man-or-zone checklist for confirming the coverage after the snap","Pressure recognition: what the box, the safeties, and the second level tell you","Six route concepts with diagrams and a concept-versus-coverage chart","Progression, timing, and situational football chapters","Three printable worksheets: pre-snap checklist, play-by-play grading, opponent scouting","Twenty practice looks with answers, plus a one-page cheat sheet"],sections:[{title:"How a Quarterback Reads a Defense",body:"A repeatable order for every snap: pre-snap picture, post-snap confirmation, then the throw. It also shows where pre-snap certainty ends and why you confirm after the snap."},{title:"The Language of the Defense",body:"The terms you need (shells, leverage, apex, rotation) and how depth and width of each defender tell you what the coverage is likely to be."},{title:"Man or Zone?",body:"The post-snap clues that separate man from zone, and what each one means for where the ball goes."},{title:"The Coverage Library",body:"Eight coverages, one per page, each with a diagram, the look, your keys, strengths, weaknesses, and the concepts that attack it.",bullets:["Cover 0 \u2014 man with no deep safety","Cover 1 \u2014 man with one deep safety","Cover 2 and Tampa 2 \u2014 two deep halves, and the middle linebacker difference","Cover 3 \u2014 three deep thirds","Cover 4 \u2014 quarters","Cover 6 \u2014 quarters to one side, halves to the other","2-Man \u2014 man underneath with two safeties over the top"]},{title:"Pressure",body:"How to see a blitz coming from alignment and rotation, and what to do with the ball when you do."},{title:"Route Concepts and Where the Ball Goes",body:"Four verticals, mesh, stick, flood, levels, and curl-flat, each with a diagram, followed by a concept-versus-coverage chart."},{title:"Progressions, Timing, and Situations",body:"How to read in order, when to hitch or move, and how down, distance, field position, and clock change what you should expect."},{title:"Film Workflow, Worksheets, and Practice Looks",body:"A film-study routine you can repeat, three printable worksheets, twenty practice looks with an answer key, and a one-page cheat sheet for your bag."}],preview:["One-page coverage cheat sheet","Pre-snap checklist worksheet","Play-by-play grading worksheet","Twenty practice looks with answers"],faqs:[{q:"Do I need film to use this?",a:"You will get the most out of it with game or practice film for the worksheets, but you can learn the coverages from the diagrams and test yourself with the twenty practice looks first."},{q:"Is this only for advanced QBs?",a:"No. It starts with the fundamentals of pre-snap identification and builds to advanced concepts. Anyone who wants to learn how to read a defense can use it."},{q:"Can I use this with the Playbook?",a:"Yes. The Playbook develops your physical and decision-making reps on the field, and its week 3 film work lines up with this guide. They also work separately."}],format:"Downloadable PDF",pages:"43 pages"},{slug:"offseason-qb-training-journal",id:"sku_journal_003",name:"Offseason QB Training Journal",tagline:"Track what you measure, improve what you track",price:12,cover:{hue:"from-[#0f1a14] via-[#0a0f0c] to-[#070a08]",label:"JOURNAL"},accent:"#5BBF9C",shortDescription:"A 46-page training journal built for a 12-week offseason: baseline test, twelve two-page weekly spreads, four-week reviews, six in-season game-week pages, a total-volume tracker, a one-line session log, and a mental-rep script.",longDescription:"The Offseason Journal is a printable 12-week training log you can use alongside the Playbook or on its own. You start with a baseline test and self-ratings. Each week has a plan with four measurable goals and a daily log of session type, minutes, throws, RPE, sleep, and soreness, then a second page with an accuracy test grid, footwork self-grade, film log, and habit tracker. Every four weeks a review page and retest checklist show what moved. Six game-week pages cover the season, and the back pages hold a total-volume tracker, a one-line-per-session log, a two-minute mental-rep script, and a pre-practice checklist.",who:"Any quarterback who wants to track an offseason and see measurable progress week over week.",benefits:["Baseline test and self-ratings to start from","Twelve weekly spreads: four measurable goals and a daily log","Accuracy test grid by depth and zone, plus a footwork self-grade","Film log and habit tracker every week","Sleep, soreness, and RPE tracked daily to manage load","Three four-week reviews with a retest checklist, then an offseason close-out","Six in-season game-week pages","Total-volume tracker, one-line session log, mental-rep script, and pre-practice checklist"],sections:[{title:"Start Here and Baseline",body:"How to use the journal, the habits to keep consistent, an offseason starting-point test, and a 1-to-5 honest self-rating."},{title:"Weekly Plan and Daily Log",body:"Four measurable goals (mechanical, film, physical, mental) and a daily log of session type, minutes, throws, RPE, sleep, and soreness, with a two-minute mental rep to start each week."},{title:"Weekly Spread, Page Two",body:"An accuracy test by depth and zone, a footwork self-grade, a film log, and a habit tracker for the week."},{title:"Four-Week Reviews",body:"A zoom-out page and retest checklist after weeks 4, 8, and 12 (5-10-5, 10-yard sprint, broad jump) so you can see what changed."},{title:"Close It Out and Game Week",body:"An offseason summary page, then six game-week pages with a scouting snapshot for in-season use."},{title:"Logs and Scripts",body:"A total-volume tracker, a one-line-per-session log, a mental-rep script, and a pre-practice checklist."}],preview:["Weekly plan with four goals and a daily log","Accuracy test grid and footwork self-grade","Four-week review and retest checklist","Pre-practice checklist"],faqs:[{q:"Is this reusable?",a:"The journal is a 12-week dated layout, so each offseason you print a fresh copy. Your purchase lets you print as many copies as you need for your own use."},{q:"Do I need the Playbook to use it?",a:"No, it works on its own. If you ru
